[package]
name = "letterlock"
version = "0.2.0"
authors = ["Pravin Paratey"]
description = "A free five-letter word-guessing game for the terminal"
edition = "2021"
rust-version = "1.80"
license = "GPL-3.0-or-later"
repository = "https://github.com/pravin/letterlock"
readme = "README.md"
keywords = ["game", "word", "puzzle", "terminal", "tui"]
categories = ["games", "command-line-utilities"]
exclude = ["img/", ".github/", ".claude/", "src/scripts/"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
dirs = "5.0"
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "letterlock"
path = "src/lib.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
